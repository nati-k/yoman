<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יומן ליווי גנים - Google Sheets Sync</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --primary: #0f766e; --primary-dark: #115e59; --primary-soft: #ccfbf1;
            --bg: #f4f7f6; --surface: #ffffff; --surface-soft: #f0fdfa;
            --text: #173b3a; --muted: #65817e; --line: #d9e8e5;
            --danger: #be123c; --danger-soft: #fff1f2;
            --shadow: 0 18px 45px rgba(20, 74, 70, 0.09);
            --nav-height: 70px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Trebuchet MS", "Arial Hebrew", sans-serif; }
        body { background: radial-gradient(circle at 10% 0%, #e4f6f1 0, transparent 33%), var(--bg); color: var(--text); min-height: 100vh; }

        /* Auth Screen */
        #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; text-align: center; background: linear-gradient(145deg, #0e4f4c, #0f766e 58%, #4c9b88); color: white; }
        .auth-card { background: rgba(255,255,255,0.97); color: var(--text); padding: 42px 34px; border-radius: 28px; box-shadow: 0 28px 70px rgba(4, 47, 46, 0.28); max-width: 430px; width: 100%; }
        .auth-mark { width: 58px; height: 58px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 18px; background: var(--primary-soft); color: var(--primary); font-size: 1.7rem; }
        .auth-title { font-size: 1.8rem; font-weight: 800; letter-spacing: .01em; margin-bottom: 10px; color: var(--text); }
        .auth-sub { font-size: 0.95rem; color: var(--muted); margin-bottom: 28px; line-height: 1.6; }
        .google-btn { background: var(--text); border: 0; color: white; padding: 14px 20px; border-radius: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; font-size: 0.95rem; transition: transform .2s, background .2s; }
        .google-btn:hover { background: #0b2928; transform: translateY(-2px); }

        /* Shell */
        #app-screen { display: none; }
        header { background: rgba(14, 79, 76, .96); color: white; padding: 14px 20px; box-shadow: 0 7px 25px rgba(20, 74, 70, .16); position: sticky; top: 0; z-index: 50; backdrop-filter: blur(12px); }
        .header-content { max-width: 900px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 14px; }
        h1 { font-size: 1.2rem; font-weight: 800; }
        .subtitle { font-size: .74rem; opacity: .8; margin-top: 3px; display: flex; align-items: center; gap: 6px; }
        .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; flex: none; }
        .sync-dot.is-busy { background: #fbbf24; }
        .sync-dot.is-error { background: #fb7185; }
        .header-exit { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.38); color: white; padding: 9px 14px; border-radius: 11px; font-size: .78rem; font-weight: 800; cursor: pointer; min-height: 40px; }

        main { max-width: 900px; margin: 0 auto; padding: 18px 20px 28px; }
        .view { display: none; }
        .view.is-active { display: block; animation: rise .28s ease both; }

        /* Navigation */
        .app-nav { max-width: 900px; margin: 14px auto 0; padding: 6px; display: flex; gap: 6px; background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 8px 20px rgba(20,74,70,.06); }
        .nav-btn { flex: 1; border: 0; background: transparent; color: var(--muted); font-size: .88rem; font-weight: 800; border-radius: 12px; cursor: pointer; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 7px; transition: background .2s, color .2s; }
        .nav-btn.is-active { background: var(--primary); color: white; }
        .nav-ico { font-size: 1.05rem; }

        /* Cards & typography */
        .card { background: var(--surface); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); border: 1px solid rgba(217,232,229,.8); margin-bottom: 16px; }
        .muted-note { font-size: .78rem; color: var(--muted); font-weight: 700; }

        /* Form fields */
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        .field { display: flex; flex-direction: column; gap: 6px; font-size: .76rem; font-weight: 800; color: var(--muted); }
        .field select, .field input { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: .95rem; color: var(--text); background: var(--surface-soft); outline: none; font-family: inherit; }
        .field select:focus, .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(15,118,110,.12); background: white; }
        .composer { position: relative; margin-bottom: 14px; }
        textarea { width: 100%; min-height: 150px; border: 1px solid var(--line); border-radius: 16px; padding: 16px 16px 56px; font-size: 1rem; line-height: 1.6; resize: vertical; background: var(--surface-soft); color: var(--text); outline: none; transition: border .2s, box-shadow .2s; }
        textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(15,118,110,.12); background: white; }

        /* Buttons */
        .btn { background: var(--primary); color: white; border: none; padding: 13px 22px; border-radius: 13px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: .95rem; min-height: 48px; transition: background .2s, box-shadow .2s; }
        .btn:hover { background: var(--primary-dark); }
        button:disabled { cursor: wait; opacity: .55; }
        .btn-secondary { background: white; color: var(--muted); border: 1px solid var(--line); padding: 11px 15px; border-radius: 12px; font-size: .85rem; font-weight: 800; cursor: pointer; min-height: 44px; transition: background .2s, color .2s; }
        .btn-secondary:hover { color: var(--primary); background: var(--surface-soft); }
        .btn-cancel { display: none; }
        .btn-mic { position: absolute; bottom: 12px; inset-inline-start: 12px; background: white; color: var(--muted); border: 1px solid var(--line); padding: 9px 14px; border-radius: 12px; cursor: pointer; font-size: .85rem; display: flex; align-items: center; gap: 6px; font-weight: 800; min-height: 40px; }
        .btn-mic.recording { background: var(--danger); color: white; border-color: var(--danger); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: .6; } 100% { opacity: 1; } }
        .icon-btn { background: transparent; border: 1px solid var(--line); color: var(--muted); width: 40px; height: 40px; border-radius: 11px; font-size: 1.05rem; font-weight: 800; cursor: pointer; display: grid; place-items: center; flex: none; }
        .icon-btn:hover { color: var(--primary); background: var(--surface-soft); }

        /* Activities */
        .activities-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
        .activities-head span { font-size: .76rem; font-weight: 800; color: var(--muted); }
        .chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
        .chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-dark); font-size: .8rem; font-weight: 800; }
        .chip button { border: 0; background: transparent; color: inherit; font-size: 1rem; line-height: 1; cursor: pointer; padding: 0 2px; }
        .chip-add { border: 1px dashed var(--primary); background: white; color: var(--primary); padding: 9px 14px; border-radius: 999px; font-size: .82rem; font-weight: 800; cursor: pointer; min-height: 40px; }
        .chip-empty { font-size: .8rem; color: var(--muted); padding: 6px 0; }

        /* Save bar */
        .save-bar { display: flex; gap: 10px; justify-content: flex-end; }
        .save-bar .btn { min-width: 160px; }

        .search-actions { display: flex; gap: 8px; justify-content: flex-end; }

        /* Entry cards */
        .entry-card { background: var(--surface-soft); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; animation: rise .3s ease both; }
        .entry-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 9px; }
        .entry-meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        .entry-garden { font-size: .85rem; font-weight: 800; color: var(--primary-dark); }
        .entry-date { font-size: .74rem; color: var(--muted); font-weight: 700; }
        .entry-actions { display: flex; align-items: center; gap: 6px; flex: none; }
        .entry-text { font-size: .92rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
        .entry-activities { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
        .entry-activity-tag { display: inline-flex; align-items: center; padding: 4px 9px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-dark); font-size: .73rem; font-weight: 800; }
        .reported-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 11px; background: white; color: var(--muted); font-size: .78rem; font-weight: 800; cursor: pointer; min-height: 40px; }
        .reported-toggle.is-on { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-dark); }
        .reported-toggle input { width: 16px; height: 16px; accent-color: var(--primary); }

        /* Card overflow menu */
        .card-menu { position: relative; }
        .menu-pop { display: none; position: absolute; inset-inline-end: 0; top: 46px; background: white; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 14px 30px rgba(20,74,70,.16); overflow: hidden; z-index: 30; min-width: 140px; }
        .card-menu.is-open .menu-pop { display: block; }
        .menu-pop button { display: block; width: 100%; text-align: start; border: 0; background: white; padding: 12px 14px; font-size: .86rem; font-weight: 800; color: var(--text); cursor: pointer; }
        .menu-pop button:hover { background: var(--surface-soft); }
        .menu-pop button.is-danger { color: var(--danger); }

        /* Gardens management */
        .manage-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; margin-bottom: 8px; min-height: 60px; }
        .garden-row-name { font-size: .94rem; font-weight: 800; color: var(--text); }
        .garden-row-count { font-size: .76rem; color: var(--muted); font-weight: 700; margin-top: 2px; }

        /* Empty state */
        .empty-state { text-align: center; padding: 34px 16px; color: var(--muted); }
        .empty-state-ico { font-size: 1.9rem; margin-bottom: 8px; }
        .empty-state-title { font-size: .92rem; font-weight: 800; color: var(--text); margin-bottom: 4px; }
        .empty-state-text { font-size: .82rem; line-height: 1.5; }

        /* Bottom sheet */
        .sheet-overlay { display: none; position: fixed; inset: 0; background: rgba(10,40,38,.45); z-index: 80; align-items: flex-end; justify-content: center; }
        .sheet-overlay.is-open { display: flex; }
        .sheet { background: white; width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); max-height: 82vh; overflow-y: auto; animation: sheetUp .26s ease both; }
        @keyframes sheetUp { from { transform: translateY(18px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
        .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .sheet-head h3 { font-size: 1rem; font-weight: 800; }
        .sheet-options { display: grid; gap: 8px; margin-bottom: 16px; }
        .sheet-option { display: flex; align-items: center; gap: 10px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 13px; font-size: .9rem; font-weight: 700; color: var(--text); cursor: pointer; min-height: 52px; }
        .sheet-option:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-dark); font-weight: 800; }
        .sheet-option input { width: 19px; height: 19px; accent-color: var(--primary); flex: none; }

        /* Dialog */
        .dialog-overlay { display: none; position: fixed; inset: 0; background: rgba(10,40,38,.45); z-index: 90; align-items: center; justify-content: center; padding: 22px; }
        .dialog-overlay.is-open { display: flex; }
        .dialog { background: white; border-radius: 20px; padding: 24px; max-width: 380px; width: 100%; box-shadow: 0 24px 60px rgba(4,47,46,.28); }
        .dialog-title { font-size: 1rem; font-weight: 800; margin-bottom: 8px; }
        .dialog-text { font-size: .88rem; color: var(--muted); line-height: 1.55; margin-bottom: 20px; }
        .dialog-input { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: .95rem; font-family: inherit; color: var(--text); background: var(--surface-soft); outline: none; margin-bottom: 20px; }
        .dialog-actions { display: flex; gap: 9px; justify-content: flex-end; }
        .btn-danger { background: var(--danger); color: white; border: 0; padding: 12px 20px; border-radius: 12px; font-weight: 800; font-size: .9rem; cursor: pointer; min-height: 46px; }

        /* Toast */
        .toast { position: fixed; inset-inline: 16px; bottom: calc(var(--nav-height) + 20px); z-index: 100; display: none; background: var(--text); color: white; padding: 14px 18px; border-radius: 14px; font-size: .88rem; font-weight: 700; box-shadow: 0 16px 34px rgba(4,47,46,.3); max-width: 420px; margin: 0 auto; text-align: center; }
        .toast.is-visible { display: block; animation: rise .25s ease both; }
        .toast.is-error { background: var(--danger); }

        @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 720px) {
            body { padding-bottom: calc(var(--nav-height) + 12px); }
            main { padding: 14px 14px 20px; }
            .card { padding: 16px; border-radius: 18px; }
            h1 { font-size: 1.05rem; }
            .app-nav { position: fixed; bottom: 0; left: 0; right: 0; margin: 0; border-radius: 18px 18px 0 0; border-bottom: 0; padding: 7px 10px calc(7px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 24px rgba(20,74,70,.13); z-index: 60; }
            .nav-btn { flex-direction: column; gap: 2px; font-size: .7rem; min-height: 52px; }
            .field-row { grid-template-columns: 1fr; }
            .save-bar { position: sticky; bottom: calc(var(--nav-height) + 6px); padding: 8px 0; background: linear-gradient(to top, var(--bg) 62%, rgba(244,247,246,0)); }
            .save-bar .btn { flex: 1; min-width: 0; }
            .entry-actions { gap: 5px; }
        }
    </style>
</head>
<body>

    <!-- 1. Authentication Gatekeeper Screen -->
    <div id="auth-screen">
        <div class="auth-card">
            <div class="auth-mark" aria-hidden="true">✦</div>
            <div class="auth-title">יומן ליווי גנים</div>
            <div class="auth-sub">התחבר עם חשבון ה-Google שלך כדי לטעון או ליצור את קובץ הנתונים האישי שלך ב-Google Drive.</div>
            <button class="google-btn" onclick="handleAuthClick()">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.18 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.18C.43 8.13 0 9.87 0 11.7c0 1.83.43 3.57 1.18 5.1l4.09-2.56z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.18 2.68 1.18 6.6l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                התחבר עם Google
            </button>
        </div>
    </div>

    <!-- 2. Main App Screen -->
    <div id="app-screen">
        <header>
            <div class="header-content">
                <div>
                    <h1>יומן ליווי גנים</h1>
                    <div class="subtitle"><span class="sync-dot" id="sync-dot"></span><span id="sync-status">מסונכרן</span></div>
                </div>
                <button class="header-exit" onclick="logout()">התנתק</button>
            </div>
        </header>

        <nav class="app-nav">
            <button class="nav-btn is-active" data-view="capture"><span class="nav-ico">✍️</span>תיעוד</button>
            <button class="nav-btn" data-view="reports"><span class="nav-ico">📋</span>דיווחים</button>
        </nav>

        <main>
            <!-- View: capture -->
            <section id="view-capture" class="view is-active">
                <div class="card">
                    <div class="field-row">
                        <label class="field"><span>גן</span><select id="entry-garden"></select></label>
                        <label class="field"><span>תאריך</span><input type="date" id="entry-date"></label>
                    </div>
                    <div class="composer">
                        <textarea id="entry-text" placeholder="מה לתעד היום? אפשר גם להקליט..."></textarea>
                        <button id="mic-btn" class="btn-mic" onclick="toggleSpeech()" title="הכתבה קולית">🎤 הקלטה</button>
                    </div>
                    <div class="activities-head">
                        <span>פעילויות</span>
                        <button class="chip-add" type="button" id="open-activities">+ בחירת פעילויות</button>
                    </div>
                    <div id="selected-activities" class="chip-row"></div>
                </div>
                <div class="save-bar">
                    <button id="cancel-edit-btn" class="btn-secondary btn-cancel" onclick="cancelEdit()">ביטול עריכה</button>
                    <button id="save-btn" class="btn" onclick="saveEntry()">שמור עדכון</button>
                </div>
            </section>

            <!-- View: reports -->
            <section id="view-reports" class="view">
                <div class="card">
                    <div class="field-row">
                        <label class="field"><span>גן</span><select id="filter-garden"></select></label>
                        <label class="field"><span>תקופה</span>
                            <select id="filter-range">
                                <option value="month">30 הימים האחרונים</option>
                                <option value="week">7 הימים האחרונים</option>
                                <option value="today">היום</option>
                                <option value="all">הכל</option>
                                <option value="custom">טווח מותאם</option>
                            </select>
                        </label>
                    </div>
                    <div class="field-row" id="custom-range" style="display: none;">
                        <label class="field"><span>מתאריך</span><input type="date" id="filter-from"></label>
                        <label class="field"><span>עד תאריך</span><input type="date" id="filter-to"></label>
                    </div>
                    <label class="field" style="margin-bottom: 14px;"><span>מילות חיפוש</span><input type="search" id="filter-keywords" placeholder="למשל: פגישה הורים חצר"></label>
                    <div class="search-actions">
                        <button id="manage-gardens" class="btn-secondary" type="button">ניהול גנים</button>
                    </div>
                </div>
                <div id="reports-results"></div>
            </section>
        </main>
    </div>

    <!-- Activity picker sheet -->
    <div class="sheet-overlay" id="activity-sheet">
        <div class="sheet">
            <div class="sheet-head">
                <h3>בחירת פעילויות</h3>
                <button class="icon-btn" type="button" id="close-activities">✕</button>
            </div>
            <div class="sheet-options" id="activity-options"></div>
            <button class="btn" type="button" id="apply-activities" style="width: 100%;">אישור</button>
        </div>
    </div>

    <!-- Gardens management sheet -->
    <div class="sheet-overlay" id="gardens-sheet">
        <div class="sheet">
            <div class="sheet-head">
                <h3>ניהול גנים</h3>
                <button class="icon-btn" type="button" id="close-gardens">✕</button>
            </div>
            <div id="gardens-manage-list"></div>
            <button class="btn" type="button" id="add-btn" onclick="addKindergarten()" style="width: 100%; margin-top: 14px;">+ הוסף גן</button>
        </div>
    </div>

    <!-- Confirm / prompt dialog -->
    <div class="dialog-overlay" id="dialog">
        <div class="dialog">
            <div class="dialog-title" id="dialog-title"></div>
            <div class="dialog-text" id="dialog-text"></div>
            <input type="text" class="dialog-input" id="dialog-input" style="display: none;">
            <div class="dialog-actions">
                <button class="btn-secondary" type="button" id="dialog-cancel">ביטול</button>
                <button class="btn" type="button" id="dialog-confirm">אישור</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const CLIENT_ID = '265026579540-ahc7t8fnaqnjj0q4pcpbg9f3fh6i8q98.apps.googleusercontent.com';
        
        let tokenClient;
        let accessToken = localStorage.getItem('yoman_access_token') || null;
        let spreadsheetId = localStorage.getItem('yoman_sheet_id') || null;

        const ATTENDANCE_SHEET_NAME = 'דוח נוכחות';
        const ATTENDANCE_CATEGORIES = ['מעטפת מקצועית', 'עבודה עם הורים וגמישות', 'מחלה / חופשה', 'מילוי טפסים', 'פיתוח תכנים', 'הכשרה ופיתוח צוותים', 'ממשקים וניהול'];
        const DRAFT_KEY = 'yoman_draft';

        let appData = { kindergartens: [], entries: {}, attendance: [] };
        let currentView = 'capture';
        let selectedActivities = [];
        let recognition = null;
        let isRecording = false;
        let tokenRequestPromise = null;
        let tokenRequestHandlers = null;
        let writeInProgress = false;
        let editingEntry = null;
        let editingGarden = null;
        let activeMicButtonId = 'mic-btn';

        document.getElementById('entry-date').valueAsDate = new Date();
        initUi();

        function initUi() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', () => setView(btn.dataset.view));
            });
            document.getElementById('filter-garden').addEventListener('change', renderReports);
            document.getElementById('filter-range').addEventListener('change', () => {
                const isCustom = document.getElementById('filter-range').value === 'custom';
                document.getElementById('custom-range').style.display = isCustom ? 'grid' : 'none';
                renderReports();
            });

        function openDialog({ title, text, confirmLabel = 'אישור', danger = false, inputValue = null }) {
            return new Promise(resolve => {
                const overlay = document.getElementById('dialog');
                const input = document.getElementById('dialog-input');
                const confirmBtn = document.getElementById('dialog-confirm');
                const cancelBtn = document.getElementById('dialog-cancel');

                document.getElementById('dialog-title').textContent = title;
                document.getElementById('dialog-text').textContent = text || '';
                document.getElementById('dialog-text').style.display = text ? 'block' : 'none';
                input.style.display = inputValue === null ? 'none' : 'block';
                input.value = inputValue ?? '';
                confirmBtn.textContent = confirmLabel;
                confirmBtn.className = danger ? 'btn-danger' : 'btn';
                overlay.classList.add('is-open');
                if (inputValue !== null) setTimeout(() => input.focus(), 50);

                const close = result => {
                    overlay.classList.remove('is-open');
                    confirmBtn.onclick = null;
                    cancelBtn.onclick = null;
                    overlay.onclick = null;
                    resolve(result);
                };
                confirmBtn.onclick = () => close(inputValue === null ? true : input.value.trim());
                cancelBtn.onclick = () => close(null);
                overlay.onclick = event => { if (event.target === overlay) close(null); };
            });
        }

        function initGsi() {
            if(typeof google === 'undefined') return;
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.metadata.readonly',
                callback: (response) => {
                    const handlers = tokenRequestHandlers;
                    tokenRequestHandlers = null;
                    tokenRequestPromise = null;
                    if (response.error !== undefined) {
                        handlers?.reject(new Error(response.error_description || response.error));
                        return;
                    }
                    accessToken = response.access_token;
                    localStorage.setItem('yoman_access_token', accessToken);
                    handlers?.resolve(accessToken);
                },
            });
        }

        async function handleAuthClick() {
            try {
                await requestGoogleToken('');
                await verifyAndLoadData();
            } catch (err) {
                showToast('שגיאת התחברות: ' + err.message, true);
            }
        }

        function requestGoogleToken(prompt) {
            if (tokenRequestPromise) return tokenRequestPromise;
            if (!tokenClient) return Promise.reject(new Error('שירות ההתחברות של Google עדיין לא נטען. נסה שוב בעוד רגע.'));

            tokenRequestPromise = new Promise((resolve, reject) => {
                tokenRequestHandlers = { resolve, reject };
                try {
                    tokenClient.requestAccessToken({ prompt });
                } catch (err) {
                    tokenRequestHandlers = null;
                    tokenRequestPromise = null;
                    reject(err);
                }
            });
            return tokenRequestPromise;
        }

        async function refreshGoogleToken() {
            try {
                return await requestGoogleToken('');
            } catch (err) {
                logout();
                throw new Error('פג תוקף חיבור Google. התחבר מחדש כדי להמשיך.');
            }
        }

        async function googleFetch(url, options = {}, canRetry = true) {
            const headers = new Headers(options.headers || {});
            headers.set('Authorization', `Bearer ${accessToken}`);
            let response = await fetch(url, { ...options, headers });

            if (response.status === 401 && canRetry) {
                await refreshGoogleToken();
                headers.set('Authorization', `Bearer ${accessToken}`);
                response = await fetch(url, { ...options, headers });
            }
            return response;
        }

        function logout() {
            accessToken = null;
            spreadsheetId = null;
            localStorage.removeItem('yoman_access_token');
            localStorage.removeItem('yoman_sheet_id');
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'flex';
        }

        async function verifyAndLoadData() {
            try {
                if (spreadsheetId) {
                    try {
                        await loadFromSheetCloud();
                        return;
                    } catch (err) {
                        if (err.status !== 403 && err.status !== 404) throw err;
                        spreadsheetId = null;
                        localStorage.removeItem('yoman_sheet_id');
                    }
                }

                // קידוד השאילתא כדי למנוע שגיאות של תווים עבריים ב-URL
                const searchQuery = encodeURIComponent("name='יומן ליווי גנים' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false");
                
                const res = await googleFetch(`https://www.googleapis.com/drive/v3/files?q=${searchQuery}&fields=files(id,name,modifiedTime)&orderBy=modifiedTime%20desc&pageSize=10`);

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error ? data.error.message : 'שגיאה בגישה ל-Google Drive');
                }

                if (data.files && data.files.length > 0) {
                    spreadsheetId = data.files[0].id;
                    localStorage.setItem('yoman_sheet_id', spreadsheetId);
                    await loadFromSheetCloud();
                } else {
                    const createNew = await openDialog({
                        title: 'לא נמצא קובץ נתונים',
                        text: "לא נמצא בדרייב קובץ בשם 'יומן ליווי גנים'. האם ליצור קובץ חדש עם 6 גנים לדוגמה?",
                        confirmLabel: 'צור קובץ'
                    });
                    if (createNew) {
                        await createNewCloudSheet();
                    } else {
                        logout();
                    }
                }
            } catch (err) {
                console.error(err);
                if (err.message.includes('Failed to fetch')) {
                    showToast('שגיאת תקשורת. ייתכן שחוסםי פרסומות חוסמים את הגישה ל-Google', true);
                } else {
                    showToast('שגיאה מול גוגל: ' + err.message, true);
                }
            }
        }

        async function createNewCloudSheet() {
            const defaultKgs = ["גן 1", "גן 2", "גן 3", "גן 4", "גן 5", "גן 6"];
            const body = {
                properties: { title: 'יומן ליווי גנים' },
                sheets: defaultKgs.map(name => ({ properties: { title: name } }))
            };
            const res = await googleFetch(`https://sheets.googleapis.com/v4/spreadsheets`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const sheetObj = await res.json();
            
            if (!res.ok) {
                throw new Error(sheetObj.error ? sheetObj.error.message : 'שגיאה ביצירת הגיליון');
            }

            spreadsheetId = sheetObj.spreadsheetId;
            localStorage.setItem('yoman_sheet_id', spreadsheetId);

            for (let name of defaultKgs) {
                await appendRowToSheet(name, ['תאריך', 'תוכן העדכון', 'שעת רישום', 'דווח', 'פעילות']);
            }
            await ensureAttendanceSheet();
            await loadFromSheetCloud();
        }

        async function loadFromSheetCloud() {
            if (!spreadsheetId || !accessToken) return;
            const metaRes = await googleFetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}?fields=sheets.properties`);
            const sheetMeta = await requireGoogleSuccess(metaRes, 'שגיאה בטעינת מבנה הגיליון');
            const sheetNames = sheetMeta.sheets.map(sheet => sheet.properties.title);
            const newKgs = sheetNames.filter(name => name !== ATTENDANCE_SHEET_NAME);
            if (newKgs.length === 0) throw new Error('לא נמצאו גנים בחוברת.');

            const params = new URLSearchParams();
            params.set('majorDimension', 'ROWS');
            newKgs.forEach(name => params.append('ranges', `'${name.replace(/'/g, "''")}'!A:E`));
            const hasAttendanceSheet = sheetNames.includes(ATTENDANCE_SHEET_NAME);
            if (hasAttendanceSheet) params.append('ranges', `'${ATTENDANCE_SHEET_NAME}'!A:G`);
            const valuesRes = await googleFetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values:batchGet?${params}`);
            const valuesData = await requireGoogleSuccess(valuesRes, 'שגיאה בטעינת הדיווחים');
            const newEntries = {};

            newKgs.forEach((title, index) => {
                const rows = valuesData.valueRanges[index]?.values || [];
                newEntries[title] = rows.slice(1)
                    .map((row, rowIndex) => ({ row, rowNumber: rowIndex + 2 }))
                    .filter(item => item.row[0])
                        .map(item => ({ date: item.row[0], text: item.row[1] || '', timestamp: item.row[2] || '', reported: item.row[3] === 'כן' || item.row[3] === 'TRUE', activity: item.row[4] || '', rowNumber: item.rowNumber }));
            });

            const attendanceRows = hasAttendanceSheet ? (valuesData.valueRanges[newKgs.length]?.values || []) : [];
            const attendance = attendanceRows.slice(1)
                .map((row, rowIndex) => ({ row, rowNumber: rowIndex + 2 }))
                .filter(item => item.row.some(Boolean))
                .map(item => ({
                    date: item.row[0] || '',
                    entryTime: item.row[1] || '',
                    exitTime: item.row[2] || '',
                    garden: item.row[3] || '',
                    extras: item.row[4] || '',
                    reported: item.row[5] === 'כן' || item.row[5] === 'TRUE',
                    sourceKey: item.row[6] || '',
                    rowNumber: item.rowNumber
                }));

            appData.kindergartens = newKgs;
            appData.entries = newEntries;
            appData.attendance = attendance;
            newKgs.forEach(gardenName => {
                (newEntries[gardenName] || []).forEach(entry => {
                    const matchingAttendance = attendance.find(item => item.date === entry.date && item.garden === gardenName && item.extras === (entry.activity || ''));
                    if (matchingAttendance) entry.sourceKey = matchingAttendance.sourceKey || '';
                });
            });
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            render();
        }

        async function appendRowToSheet(sheetName, rowData) {
            if (!spreadsheetId || !accessToken) return;
            const range = `'${sheetName.replace(/'/g, "''")}'!A1`;
            const res = await googleFetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${encodeURIComponent(range)}:append?valueInputOption=RAW`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ values: [rowData] })
            });
            const data = await res.json();
            if (!res.ok) {
                throw new Error(data.error ? data.error.message : 'שגיאה בשמירת הנתונים');
            }
        }

        async function updateRowInSheet(sheetName, rowNumber, rowData) {
            if (!spreadsheetId || !accessToken) return;
            const endColumn = String.fromCharCode(64 + rowData.length);
            const range = `'${sheetName.replace(/'/g, "''")}'!A${rowNumber}:${endColumn}${rowNumber}`;
            const res = await googleFetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${encodeURIComponent(range)}?valueInputOption=RAW`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ range, majorDimension: 'ROWS', values: [rowData] })
            });
            const data = await res.json();
            if (!res.ok) {
                throw new Error(data.error ? data.error.message : 'שגיאה בעדכון הנתונים');
            }
        }

        async function requireGoogleSuccess(res, fallbackMessage) {
            const data = await res.json();
            if (!res.ok) {
                const error = new Error(data.error ? data.error.message : fallbackMessage);
                error.status = res.status;
                throw error;
            }
            return data;
        }

        function validateKindergartenName(name, currentName = null) {

            if (/[\\/?*\[\]:]/.test(trimmed)) return 'שם הגן אינו יכול להכיל את התווים: \\ / ? * [ ] :';
            if (trimmed !== currentName && appData.kindergartens.includes(trimmed)) return 'הגן כבר קיים.';
            return null;
        }

        function formatHebrewDate(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                const year = parts[0];
                const monthNum = parseInt(parts[1], 10);
                const day = parseInt(parts[2], 10);
                const months = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
                if (monthNum >= 1 && monthNum <= 12) {
                    return `${day} ב${months[monthNum - 1]} ${year}`;
                }
            }
            return dateStr;
        }

        function toIsoDate(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function formatEntryCount(count) {
            if (count === 0) return 'אין דיווחים';
            if (count === 1) return 'דיווח אחד';
            return `${count} דיווחים`;
        }

        // null = no date limit, false = invalid custom range
        function getFilterRange() {
            const mode = document.getElementById('filter-range').value;
            if (mode === 'all') return null;

            const today = new Date();
            if (mode === 'custom') {
                const from = document.getElementById('filter-from').value;
                const to = document.getElementById('filter-to').value || from;
                if (!from) return null;
                if (to < from) return false;
                return { from, to };
            }

            const from = new Date(today);
            if (mode === 'week') from.setDate(today.getDate() - 6);
            if (mode === 'month') from.setDate(today.getDate() - 29);
            return { from: toIsoDate(from), to: toIsoDate(today) };
        }

            const previous = select.value;
            select.innerHTML = '<option value="">כל הגנים</option>' +

        function renderReports() {
            renderFilterGardenSelect();
            const results = document.getElementById('reports-results');
            results.innerHTML = '';

            const range = getFilterRange();
            if (range === false) {
                results.innerHTML = '<div class="empty-state"><div class="empty-state-ico">⚠️</div><div class="empty-state-title">טווח תאריכים לא תקין</div><div class="empty-state-text">תאריך הסיום חייב להיות אחרי תאריך ההתחלה.</div></div>';
                return;
            }

            const gardenFilter = document.getElementById('filter-garden').value;
            const keywords = document.getElementById('filter-keywords').value.trim().toLocaleLowerCase('he').split(/\s+/).filter(Boolean);
            const gardens = gardenFilter ? [gardenFilter] : appData.kindergartens;
            const matches = [];
            gardens.forEach(garden => {
                (appData.entries[garden] || []).forEach(entry => {
                    if (range && (entry.date < range.from || entry.date > range.to)) return;
                    const searchableText = `${entry.text || ''} ${entry.activity || ''}`.toLocaleLowerCase('he');
                    if (!keywords.every(keyword => searchableText.includes(keyword))) return;
                    matches.push({ garden, entry });
                });
            });
            matches.sort((a, b) => b.entry.date.localeCompare(a.entry.date) || (b.entry.rowNumber || 0) - (a.entry.rowNumber || 0));

            if (matches.length === 0) {
                results.innerHTML = '<div class="empty-state"><div class="empty-state-ico">📭</div><div class="empty-state-title">אין דיווחים להצגה</div><div class="empty-state-text">נסה לשנות את הגן או את התקופה.</div></div>';
                return;
            }

            const scope = gardenFilter || 'כל הגנים';
            const period = range ? (range.from === range.to ? formatHebrewDate(range.from) : `${formatHebrewDate(range.from)} - ${formatHebrewDate(range.to)}`) : 'כל התקופות';
            const summary = document.createElement('div');
            summary.className = 'muted-note';
            summary.style.marginBottom = '10px';
            summary.textContent = `${formatEntryCount(matches.length)} · ${scope} · ${period}${keywords.length ? ` · מילות חיפוש: ${keywords.join(', ')}` : ''}`;
            results.appendChild(summary);
            matches.forEach(({ garden, entry }) => results.appendChild(buildEntryCard(garden, entry, !gardenFilter)));
        }

        function buildEntryCard(garden, entry, showGarden) {
            const card = document.createElement('div');
            card.className = 'entry-card';
            const tags = (entry.activity || '').split(',').map(value => value.trim()).filter(Boolean)
                .map(value => `<span class="entry-activity-tag">${escapeHtml(value)}</span>`).join('');
            card.innerHTML = `
                <div class="entry-head">
                    <div class="entry-meta">
                        ${showGarden ? `<span class="entry-garden">${escapeHtml(garden)}</span>` : ''}
                        <span class="entry-date">${escapeHtml(formatHebrewDate(entry.date))}${entry.timestamp ? ` · ${escapeHtml(entry.timestamp)}` : ''}</span>
                    </div>
                    <div class="entry-actions">
                        <label class="reported-toggle${entry.reported ? ' is-on' : ''}">
                            <input type="checkbox" ${entry.reported ? 'checked' : ''} aria-label="סומן כדווח">דווח
                        </label>
                        <div class="card-menu">
                            <button class="icon-btn" type="button" title="פעולות">⋮</button>
                            <div class="menu-pop">
                                <button type="button" data-act="edit">עריכה</button>
                                <button type="button" class="is-danger" data-act="delete">מחיקה</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="entry-text">${escapeHtml(entry.text)}</div>
                ${tags ? `<div class="entry-activities">${tags}</div>` : ''}
            `;
            const menu = card.querySelector('.card-menu');
            menu.querySelector('.icon-btn').onclick = event => {
                event.stopPropagation();
                const wasOpen = menu.classList.contains('is-open');
                document.querySelectorAll('.card-menu.is-open').forEach(item => item.classList.remove('is-open'));
                menu.classList.toggle('is-open', !wasOpen);
            };
            card.querySelector('[data-act="edit"]').onclick = () => openEntryForEdit(garden, entry);
            card.querySelector('[data-act="delete"]').onclick = () => deleteEntry(garden, entry);
            card.querySelector('.reported-toggle input').onchange = event => toggleEntryReported(garden, entry, event.target.checked);
            return card;
        }

        function openEntryForEdit(garden, entry) {
            editingEntry = entry;
            editingGarden = garden;
            renderGardenSelect();
            document.getElementById('entry-garden').value = garden;
            document.getElementById('entry-date').value = entry.date;
            document.getElementById('entry-text').value = entry.text;
            selectedActivities = (entry.activity || '').split(',').map(value => value.trim()).filter(Boolean);
            renderSelectedActivities();
            updateEditControls();
            setView('capture');
            document.getElementById('entry-text').focus();
        }

        async function ensureAttendanceSheet() {
            const metaRes = await googleFetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}?fields=sheets.properties`);
            const meta = await requireGoogleSuccess(metaRes, 'שגיאה באיתור גיליון דוח הנוכחות');
            if (meta.sheets.some(sheet => sheet.properties.title === ATTENDANCE_SHEET_NAME)) return;
            const addRes = await googleFetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}:batchUpdate`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ requests: [{ addSheet: { properties: { title: ATTENDANCE_SHEET_NAME } } }] })
            });
            await requireGoogleSuccess(addRes, 'שגיאה ביצירת גיליון דוח הנוכחות');
            await appendRowToSheet(ATTENDANCE_SHEET_NAME, ['יום', 'שעת כניסה', 'שעת יציאה', 'גן', 'נוספים - הערות', 'דווחה', 'מזהה מקור']);
        }

        async function updateAttendanceRow(entry, rowData) {
            const endColumn = String.fromCharCode(64 + rowData.length);
            const range = `'${ATTENDANCE_SHEET_NAME}'!A${entry.rowNumber}:${endColumn}${entry.rowNumber}`;
            const res = await googleFetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${encodeURIComponent(range)}?valueInputOption=RAW`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ range, majorDimension: 'ROWS', values: [rowData] })
            });
            await requireGoogleSuccess(res, 'שגיאה בעדכון רשומת הנוכחות');
        }

        function createAttendanceSourceKey() {
            return `entry-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
        }

        async function syncGardenEntryToAttendance(entry, gardenName, activity, reported, mode) {
            await ensureAttendanceSheet();
            const sourceKey = entry.sourceKey || createAttendanceSourceKey();
            const rowData = [entry.date, '', '', gardenName, activity || '', reported ? 'כן' : 'לא', sourceKey];
            const existing = appData.attendance.find(item => item.sourceKey === sourceKey) || appData.attendance.find(item => item.date === entry.date && item.garden === gardenName && item.extras === (activity || ''));

            if (mode === 'delete') {
                if (existing) await deleteAttendanceEntry(existing, false, false);
                return sourceKey;
            }

            if (existing) {
                await updateAttendanceRow(existing, rowData);
                Object.assign(existing, { date: entry.date, garden: gardenName, extras: activity || '', reported, sourceKey });
            } else {
                await appendRowToSheet(ATTENDANCE_SHEET_NAME, rowData);
                const rowNumber = appData.attendance.reduce((max, item) => Math.max(max, item.rowNumber || 1), 1) + 1;
                appData.attendance.push({ date: entry.date, entryTime: '', exitTime: '', garden: gardenName, extras: activity || '', reported, sourceKey, rowNumber });
            }
            return sourceKey;
        }

        async function deleteAttendanceEntry(entry, askForConfirmation = true, manageBusyState = true) {
            if (askForConfirmation) {
                const approved = await openDialog({ title: 'מחיקת רשומת נוכחות', text: 'הפעולה תסיר את השורה מגיליון דוח הנוכחות.', confirmLabel: 'מחק', danger: true });
                if (!approved) return;
            }
            if (manageBusyState) setWriteInProgress(true);
            try {
                const metaRes = await googleFetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}?fields=sheets.properties`);
                const meta = await requireGoogleSuccess(metaRes, 'שגיאה באיתור גיליון דוח הנוכחות');
                const sheet = meta.sheets.find(item => item.properties.title === ATTENDANCE_SHEET_NAME);
                const deleteRes = await googleFetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}:batchUpdate`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ requests: [{ deleteDimension: { range: { sheetId: sheet.properties.sheetId, dimension: 'ROWS', startIndex: entry.rowNumber - 1, endIndex: entry.rowNumber } } }] })
                });
                await requireGoogleSuccess(deleteRes, 'מחיקת רשומת הנוכחות נכשלה');
                appData.attendance = appData.attendance.filter(item => item !== entry).map(item => item.rowNumber > entry.rowNumber ? { ...item, rowNumber: item.rowNumber - 1 } : item);
            } catch (err) { showToast('מחיקת רשומת הנוכחות נכשלה: ' + err.message, true); }
            finally { if (manageBusyState) setWriteInProgress(false); }
        }

        function render() {
            renderGardenSelect();
            renderSelectedActivities();
            if (currentView === 'reports') renderReports();
            if (document.getElementById('gardens-sheet').classList.contains('is-open')) renderGardensManageList();
        }

        function applyGardenDetection(text) {
            const lower = text.toLowerCase();
            const match = appData.kindergartens.find(name => lower.includes(name.toLowerCase()));
            if (match) document.getElementById('entry-garden').value = match;
        }

        async function removeEntryRow(sheetName, entry) {
            const metaRes = await googleFetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}?fields=sheets.properties`);
            const meta = await requireGoogleSuccess(metaRes, 'שגיאה באיתור הגיליון');
            const sheet = meta.sheets.find(item => item.properties.title === sheetName);
            if (!sheet) throw new Error('הגיליון לא נמצא.');
            const deleteRes = await googleFetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}:batchUpdate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ requests: [{ deleteDimension: { range: { sheetId: sheet.properties.sheetId, dimension: 'ROWS', startIndex: entry.rowNumber - 1, endIndex: entry.rowNumber } } }] })
            });
            await requireGoogleSuccess(deleteRes, 'מחיקת הרשומה נכשלה');
            appData.entries[sheetName] = (appData.entries[sheetName] || [])
                .filter(item => item !== entry)
                .map(item => item.rowNumber > entry.rowNumber ? { ...item, rowNumber: item.rowNumber - 1 } : item);
        }

        async function saveEntry() {
            const textEl = document.getElementById('entry-text');
            const text = textEl.value.trim();
            const date = document.getElementById('entry-date').value;
            const gardenName = document.getElementById('entry-garden').value;
            const activity = selectedActivities.join(', ');

            if (!gardenName) { showToast('נא לבחור גן', true); return; }
            if (!text) { showToast('נא להזין טקסט לדיווח', true); return; }
            if (!date) { showToast('נא לבחור תאריך', true); return; }
            if (writeInProgress) return;

            if (!appData.entries[gardenName]) appData.entries[gardenName] = [];
            const timeStr = editingEntry?.timestamp || new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });

            setWriteInProgress(true);
            setSyncState('busy', 'שומר...');
            try {
                if (editingEntry && editingGarden && editingGarden !== gardenName) {
                    const reported = editingEntry.reported;
                    const sourceKey = editingEntry.sourceKey;
                    await removeEntryRow(editingGarden, editingEntry);
                    await appendRowToSheet(gardenName, [date, text, timeStr, reported ? 'כן' : 'לא', activity]);
                    const target = appData.entries[gardenName];
                    const rowNumber = target.reduce((max, item) => Math.max(max, item.rowNumber || 1), 1) + 1;
                    const moved = { date, text, timestamp: timeStr, reported, activity, sourceKey, rowNumber };
                    moved.sourceKey = await syncGardenEntryToAttendance(moved, gardenName, activity, reported, 'update');
                    target.push(moved);
                } else if (editingEntry) {
                    await updateRowInSheet(gardenName, editingEntry.rowNumber, [date, text, timeStr, editingEntry.reported ? 'כן' : 'לא', activity]);
                    editingEntry.date = date;
                    editingEntry.text = text;
                    editingEntry.timestamp = timeStr;
                    editingEntry.activity = activity;
                    editingEntry.sourceKey = await syncGardenEntryToAttendance(editingEntry, gardenName, activity, editingEntry.reported, 'update');
                } else {
                    await appendRowToSheet(gardenName, [date, text, timeStr, 'לא', activity]);
                    const target = appData.entries[gardenName];
                    const rowNumber = target.reduce((max, item) => Math.max(max, item.rowNumber || 1), 1) + 1;
                    const savedEntry = { date, text, timestamp: timeStr, reported: false, activity, sourceKey: '', rowNumber };
                    savedEntry.sourceKey = await syncGardenEntryToAttendance(savedEntry, gardenName, activity, false, 'create');
                    target.push(savedEntry);
                }

                const wasEditing = Boolean(editingEntry);
                editingEntry = null;
                editingGarden = null;
                updateEditControls();
                textEl.value = '';
                selectedActivities = [];
                localStorage.removeItem(DRAFT_KEY);
                render();
                setSyncState('ok', 'מסונכרן');
                showToast(wasEditing ? 'הדיווח עודכן' : 'הדיווח נשמר');
            } catch (err) {
                setSyncState('error', 'שגיאת סנכרון');
                showToast('השמירה נכשלה: ' + err.message, true);
            } finally {
                setWriteInProgress(false);
            }
        }

        async function toggleEntryReported(sheetName, entry, reported) {
            if (writeInProgress) return;
            setWriteInProgress(true);
            setSyncState('busy', 'מעדכן...');
            try {
                await updateRowInSheet(sheetName, entry.rowNumber, [entry.date, entry.text, entry.timestamp, reported ? 'כן' : 'לא', entry.activity || '']);
                entry.sourceKey = await syncGardenEntryToAttendance(entry, sheetName, entry.activity || '', reported, 'update');
                entry.reported = reported;
                setSyncState('ok', 'מסונכרן');
            } catch (err) {
                setSyncState('error', 'שגיאת סנכרון');
                showToast('עדכון סטטוס הדיווח נכשל: ' + err.message, true);
            } finally {
                setWriteInProgress(false);
                render();
            }
        }

        async function deleteEntry(sheetName, entry) {
            if (writeInProgress) return;
            const approved = await openDialog({
                title: 'מחיקת דיווח',
                text: 'הדיווח יימחק מהגיליון ומדוח הנוכחות. לא ניתן לשחזר.',
                confirmLabel: 'מחק',
                danger: true
            });
            if (!approved) return;

            setWriteInProgress(true);
            setSyncState('busy', 'מוחק...');
            try {
                await removeEntryRow(sheetName, entry);
                if (entry.sourceKey) await syncGardenEntryToAttendance(entry, sheetName, entry.activity || '', entry.reported, 'delete');
                if (editingEntry === entry) cancelEdit();
                setSyncState('ok', 'מסונכרן');
                showToast('הדיווח נמחק');
                render();
            } catch (err) {
                setSyncState('error', 'שגיאת סנכרון');
                showToast('מחיקת הדיווח נכשלה: ' + err.message, true);
            } finally {
                setWriteInProgress(false);
            }
        }

        function cancelEdit() {
            editingEntry = null;
            editingGarden = null;
            document.getElementById('entry-text').value = '';
            document.getElementById('entry-date').valueAsDate = new Date();
            selectedActivities = [];
            renderSelectedActivities();
            localStorage.removeItem(DRAFT_KEY);
            updateEditControls();
        }

        function updateEditControls() {
            const saveButton = document.getElementById('save-btn');
            const cancelButton = document.getElementById('cancel-edit-btn');

            if (!name) return;

            const validationError = validateKindergartenName(name);

            if (writeInProgress) return;

            setWriteInProgress(true);
            setSyncState('busy', 'מוסיף גן...');

                const res = await googleFetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}:batchUpdate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ requests: [{ addSheet: { properties: { title: name } } }] })
                });
                await requireGoogleSuccess(res, 'שגיאה בהוספת הגן');

        async function renameKindergarten(current) {
            if (!current) return;
            const newName = await openDialog({ title: 'שינוי שם הגן', confirmLabel: 'שמור', inputValue: current });
            if (!newName || newName === current) return;

            const validationError = validateKindergartenName(newName, current);
            if (validationError) { showToast(validationError, true); return; }
            if (writeInProgress) return;

            setWriteInProgress(true);
            setSyncState('busy', 'מעדכן...');
            try {
                const res = await googleFetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}?fields=sheets.properties`);
                const meta = await requireGoogleSuccess(res, 'שגיאה באיתור הגן');
                const sheet = meta.sheets.find(item => item.properties.title === current);
                if (!sheet) throw new Error('הגן לא נמצא בגיליון.');

                const updateRes = await googleFetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}:batchUpdate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ requests: [{ updateSheetProperties: { properties: { sheetId: sheet.properties.sheetId, title: newName }, fields: 'title' } }] })
                });
                await requireGoogleSuccess(updateRes, 'שגיאה בשינוי שם הגן');
                appData.kindergartens[appData.kindergartens.indexOf(current)] = newName;
                appData.entries[newName] = appData.entries[current] || [];
                delete appData.entries[current];
                if (editingGarden === current) editingGarden = newName;
                setSyncState('ok', 'מסונכרן');
                showToast('שם הגן עודכן');
                render();
            } catch (err) {
                setSyncState('error', 'שגיאת סנכרון');
                showToast('שינוי שם הגן נכשל: ' + err.message, true);
            } finally {
                setWriteInProgress(false);
            }
        }

        async function deleteKindergarten(current) {
            if (!current) return;
            if (appData.kindergartens.length <= 1) {
                showToast('חייב להישאר לפחות גן אחד', true);
                return;
            }

            const approved = await openDialog({
                title: `מחיקת ${current}`,
                text: 'כל הדיווחים של הגן יימחקו מהגיליון. לא ניתן לשחזר.',
                confirmLabel: 'מחק',
                danger: true
            });
            if (!approved || writeInProgress) return;

            setWriteInProgress(true);
            setSyncState('busy', 'מוחק...');
            try {
                const res = await googleFetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}?fields=sheets.properties`);
                const meta = await requireGoogleSuccess(res, 'שגיאה באיתור הגן');
                const sheet = meta.sheets.find(item => item.properties.title === current);
                if (!sheet) throw new Error('הגן לא נמצא בגיליון. טען מחדש את הדף ונסה שוב.');

                const deleteRes = await googleFetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}:batchUpdate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ requests: [{ deleteSheet: { sheetId: sheet.properties.sheetId } }] })
                });
                await requireGoogleSuccess(deleteRes, 'שגיאה במחיקת הגן');
                appData.kindergartens = appData.kindergartens.filter(name => name !== current);
                delete appData.entries[current];
                if (editingGarden === current) cancelEdit();
                setSyncState('ok', 'מסונכרן');
                showToast(`${current} נמחק`);
                render();
            } catch (err) {
                setSyncState('error', 'שגיאת סנכרון');
                showToast('מחיקת הגן נכשלה: ' + err.message, true);
            } finally {
                setWriteInProgress(false);
            }
        }

        function getMobileBrowserInfo() {
            const ua = navigator.userAgent || '';
            const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const isAndroid = /Android/i.test(ua);
            const isChrome = /Chrome|CriOS|Chromium/i.test(ua);
            return { isIOS, isAndroid, isChrome };
        }

        async function toggleSpeech(targetId = 'entry-text', buttonId = 'mic-btn') {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const isSecureContext = window.isSecureContext || location.protocol === 'https:' || location.hostname === 'localhost';
            const mobile = getMobileBrowserInfo();

            if (isRecording) {
                if (recognition) recognition.stop();
                return;
            }

            if (!isSecureContext) {
                showToast('ההכתבה הקולית דורשת אתר מאובטח (https)', true);
                return;
            }

            if (!SpeechRecognition) {
                if (mobile.isIOS) {
                    focusKeyboardDictation('ב-Chrome באייפון, ההכתבה עשויה לעבוד רק דרך Dictation של המקלדת. אם המיקרופון חסום, אפשר להפעיל אותו בהגדרות האפליקציה/אתר.', targetId);
                } else if (mobile.isAndroid && mobile.isChrome) {
                    focusKeyboardDictation('ב-Chrome באנדרואיד, אם ההקלטה לא מופעלת, אפשר להפעיל מיקרופון מהגדרות האתר או להשתמש בהכתבה מהמקלדת.', targetId);
                } else {
                    focusKeyboardDictation('ההכתבה באתר אינה זמינה בדפדפן הזה. השתמש במקלדת/Dictation או ב-Chrome/Edge עם הרשאת מיקרופון.', targetId);
                }
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'he-IL';
            recognition.interimResults = false;
            recognition.continuous = false;
            recognition.maxAlternatives = 1;

            const micBtn = document.getElementById(buttonId);
            activeMicButtonId = buttonId;
            recognition.onstart = () => { isRecording = true; micBtn.className = 'btn-mic recording'; micBtn.innerText = '🔴 מאזין...'; };
            recognition.onresult = (e) => {
                let transcript = '';
                for (let i = 0; i < e.results.length; i++) {
                    transcript += e.results[i][0]?.transcript || '';
                }
                if (!transcript.trim()) return;
                const textField = document.getElementById(targetId);
                textField.value = [textField.value.trim(), transcript.trim()].filter(Boolean).join(' ');
                if (targetId === 'entry-text') {
                    applyGardenDetection(transcript.trim());
                    saveDraft();
                }
            };
            recognition.onerror = (event) => {
                const messages = {
                    'not-allowed': 'הגישה למיקרופון נחסמה. אפשר את המיקרופון בהגדרות האתר ובדפדפן.',
                    'audio-capture': 'לא נמצא מיקרופון פעיל. בדוק שהוא מחובר ושנבחר כמיקרופון המערכת.',
                    'network': 'שירות ההכתבה הקולית אינו זמין ברשת הזו. נסה Chrome או Edge ובדוק את חיבור האינטרנט.',
                    'no-speech': 'לא זוהה קול. נסה לדבר קרוב יותר למיקרופון.',
                    'service-not-allowed': 'שירות ההכתבה חסום בדפדפן הזה. בטלפון, השתמש בהכתבה מהמקלדת או פתח את האתר ב-Chrome/Edge.',
                    'aborted': 'ההקלטה הופסקה.'
                };
                stopMic();
                if (event.error === 'service-not-allowed' || event.error === 'not-allowed') {
                    focusKeyboardDictation('הגישה למיקרופון נחסמה. בדפדפן/מערכת ההפעלה, אפשר הרשאת מיקרופון או השתמש בהכתבה מהמקלדת.', targetId);
                } else if (event.error !== 'aborted') {
                    showToast(messages[event.error] || `שגיאת הכתבה: ${event.error || 'לא ידועה'}`, true);
                }
            };
            recognition.onend = () => stopMic();
            try { recognition.start(); } catch (ex) { stopMic(); }
        }

        function focusKeyboardDictation(message = 'ההכתבה באתר אינה זמינה בדפדפן הזה. השתמש במיקרופון של המקלדת או ב-Chrome/Edge עם הרשאת מיקרופון.', targetId = 'entry-text') {
            const textField = document.getElementById(targetId);
            if (textField) {
                textField.focus();
                textField.selectionStart = textField.value.length;
                textField.selectionEnd = textField.value.length;
            }
            showToast(message, true);
        }

        function stopMic() {
            isRecording = false;
            const micBtn = document.getElementById(activeMicButtonId);
            if(micBtn) { micBtn.className = 'btn-mic'; micBtn.innerText = '🎤 הקלטה'; }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]));
        }
    </script>
</body>
</html>
